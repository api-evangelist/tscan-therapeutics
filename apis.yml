name: TScan Therapeutics
description: 'TScan Therapeutics (Nasdaq: TCRX) is a clinical-stage biopharmaceutical company based in
  Waltham, Massachusetts developing T-cell receptor engineered T-cell (TCR-T) therapies for the treatment
  of patients with cancer. The company uses a high-throughput, genome-wide target-discovery platform to
  identify the TCRs and antigen targets that drive T-cell recognition of tumors, building a multiplexed
  library of TCR-T candidates (ImmunoBank) for both hematologic malignancies and solid tumors. Lead
  programs TSC-100 and TSC-101 target minor histocompatibility antigens to prevent disease relapse after
  allogeneic hematopoietic cell transplant. As a therapeutics company it exposes no public developer API
  surface; this profile captures its identity and probed domain-security posture for the API Evangelist
  network. Backed by Bessemer Venture Partners and GV.'
